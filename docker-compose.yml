services:
  # ── 1. LiveKit Token Server (FastAPI) ─────────────────────────
  token-server:
    build:
      context: ./token-server
      dockerfile: Dockerfile
    container_name: drishti-token-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./logs:/app/logs:ro
    networks:
      - drishti-net

  # ── 2. LiveKit Agent Worker (Python) ─────────────────────────
  livekit-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: drishti-livekit-agent
    restart: unless-stopped
    depends_on:
      token-server:
        condition: service_healthy
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LLM_PROVIDER=${LLM_PROVIDER:-google}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_MODEL=${GOOGLE_MODEL:-gemini-3.5-flash-lite}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - SARVAM_STT_LANGUAGE=${SARVAM_STT_LANGUAGE:-unknown}
      - SARVAM_TTS_LANGUAGE=${SARVAM_TTS_LANGUAGE:-hi-IN}
      - SARVAM_TTS_SPEAKER=${SARVAM_TTS_SPEAKER:-kabir}
      - SARVAM_TTS_PACE=${SARVAM_TTS_PACE:-1.18}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_BACKUP_KEY=${OPENAI_BACKUP_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - DEFAULT_AGENT_MODE=${DEFAULT_AGENT_MODE:-assistant}
      - ENABLE_CONVERSATION_LOGS=${ENABLE_CONVERSATION_LOGS:-true}
      - OBSERVER_TERMINAL_OUTPUT=${OBSERVER_TERMINAL_OUTPUT:-true}
      - OBSERVER_MAX_LOG_BYTES=${OBSERVER_MAX_LOG_BYTES:-10485760}
    volumes:
      - ./logs:/app/logs
    env_file:
      - path: .env
        required: false
    networks:
      - drishti-net

  # ── 3. Optional Automated HTTPS Reverse Proxy (Caddy) ──────────
  # Uncomment or activate profile if you have a custom domain on Vultr
  caddy:
    image: caddy:2-alpine
    container_name: drishti-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - token-server
    networks:
      - drishti-net
    profiles:
      - ssl

networks:
  drishti-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
